<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background Badge -->
  <rect width="100" height="100" rx="20" fill="#0a0a0a" />
  <!-- Kenyan Flag inspired Red Accent Bar -->
  <rect x="0" y="44" width="100" height="12" fill="#dc2626" />
  <rect x="0" y="42" width="100" height="2" fill="#ffffff" />
  <rect x="0" y="56" width="100" height="2" fill="#ffffff" />
  <!-- Circular Center Emblem -->
  <circle cx="50" cy="50" r="32" fill="#171717" stroke="#dc2626" stroke-width="3" />
  <!-- Stylized Monogram "A" for Amani Center CBO -->
  <text x="50" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>
  <circle cx="50" cy="50" r="36" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2" />
</svg>
